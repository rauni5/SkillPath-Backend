spring:
  datasource:
    url:      jdbc:postgresql://pg-3e503547-raunit06-9fa2.a.aivencloud.com:20671/defaultdb?sslmode=require
    username: skillpath
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle:      2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        "[format_sql]": false

  flyway:
    enabled:   true
    locations: classpath:db/migration
firebase:
  service-account: ${FIREBASE_SERVICE_ACCOUNT:}
server:
  port: ${PORT:8080}
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path:               /swagger-ui.html
    operationsSorter:   method
logging:
  level:
    root: WARN
    "[com.skillpath]": INFO
    "[org.springframework]": WARN
    "[org.hibernate]": WARN
    "[org.flywaydb]": INFO