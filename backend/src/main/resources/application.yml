spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/skillpath
    username: skillpath
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle:      2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        "[format_sql]": false

  flyway:
    enabled:   true
    locations: classpath:db/migration
firebase:
  service-account: ${FIREBASE_SERVICE_ACCOUNT:}
gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-2.5-flash-lite}
supabase:
  url: ${SUPABASE_URL:}
  service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
  avatar-bucket: ${SUPABASE_AVATAR_BUCKET:avatars}
server:
  port: ${PORT:8080}
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path:               /swagger-ui.html
    operationsSorter:   method
logging:
  level:
    root: WARN
    "[com.skillpath]": INFO
    "[org.springframework]": WARN
    "[org.hibernate]": WARN
    "[org.flywaydb]": INFO