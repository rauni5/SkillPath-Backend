services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: skillpath
      POSTGRES_USER: skillpath
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports: ['5432:5432']
    volumes: ['postgres_data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL','pg_isready -U skillpath']
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  postgres_data: